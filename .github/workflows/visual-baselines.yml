name: Visual baselines

# Renders the baseline images the mocked Playwright specs compare against, on
# the platform CI compares on. Run it by hand on a branch whose pages changed
# on purpose, then commit the images from the `visual-baselines` artifact
# (e2e/README.md).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render baselines
    # The runner the mocked job compares on (ci.yml), so the images match.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build
        run: npm run build

      - name: Render
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: http://localhost:8081
        run: |
          npm run preview -- --port 8081 &
          npx wait-on http://localhost:8081 --timeout 60000
          npx playwright test --project=mocked --update-snapshots

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baselines
          path: e2e/**/*-linux.png
          if-no-files-found: error
          retention-days: 7
