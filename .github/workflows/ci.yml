name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          # Errors fail, and so does a warning beyond the 21 there are today
          # (most are react-refresh/only-export-components, an
          # HMR-ergonomics rule): the count may only go down.
          - { name: lint, cmd: 'npm run lint -- --max-warnings 21' }
          - { name: format, cmd: 'npm run format:check' }
          - { name: typecheck, cmd: 'npx tsc -b --pretty' }
          # With the coverage floor of vitest.config.ts.
          - { name: unit, cmd: 'npm run test:coverage' }
          - { name: knip, cmd: 'npm run knip' }
          # Known vulnerabilities, high or worse, in what ships in the bundle.
          - {
              name: dependencies,
              cmd: 'npm audit --omit=dev --audit-level=high',
            }
          # The build, then the first load against its budget
          # (scripts/check-bundle-size.mjs).
          - { name: build, cmd: 'npm run build && npm run check-bundle-size' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.cmd }}

  # The checked-in runtime client against the pinned runtara release's
  # openapi.json (scripts/generate-api-runtime-release.mjs --check). What the
  # client has beyond that release, generated from a server not yet released,
  # is recorded in scripts/api-runtime.pending.patch and passes; any other
  # difference fails.
  api-client:
    name: API client matches the pinned release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run check-api-runtime-release

  # The console with an edition in place of src/edition, which the checks
  # above never build: type-checked, tested and bundled with the example one
  # (examples/edition), which fills in every part of `Edition`.
  edition:
    name: Builds with an edition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run test:edition

      - name: Bundle with the example edition
        env:
          RUNTARA_EDITION_DIR: examples/edition
        run: npx vite build

      - name: The bundle carries the edition's pages
        run: grep -rlF 'Accept the invitation' dist/assets

  e2e-mocked:
    name: E2E (mocked)
    # Playwright 1.59.1 supports Ubuntu 24.04; ubuntu-latest has moved to
    # 26.04, where its browser dependency installer fails before tests run.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build app
        run: npm run build

      - name: Serve preview build
        run: |
          npm run preview -- --port 8081 &
          npx wait-on http://localhost:8081 --timeout 60000

      - name: Run mocked Playwright project
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8081
          CI: 'true'
        run: npx playwright test --project=mocked

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-mocked-report
          path: |
            e2e-report/
            e2e-results/
          retention-days: 14

  # The console image (Dockerfile): builds, renders config.js from env at
  # start, refuses a config it cannot serve, and serves the console's pages.
  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build
        run: docker build -t runtara-frontend:ci --build-arg VERSION=0.0.0-ci .

      - name: Refuses oidc without an authority
        run: |
          if docker run --rm runtara-frontend:ci; then
              echo "::error::started with RUNTARA_UI_AUTH_MODE=oidc and no RUNTARA_UI_OIDC_AUTHORITY"
              exit 1
          fi

      - name: Serves the console with its rendered config
        run: |
          docker run -d --name console -p 8080:8080 \
            -e RUNTARA_UI_AUTH_MODE=local \
            -e RUNTARA_UI_API_BASE_URL=http://localhost:7001 \
            -e RUNTARA_UI_TENANT_ID=ci \
            runtara-frontend:ci
          for _ in $(seq 1 30); do
              curl -fsS http://localhost:8080/healthz >/dev/null && break
              sleep 1
          done
          curl -fsS http://localhost:8080/config.js | tee /dev/stderr \
            | grep -F '"hosting":"static","authMode":"local","apiBaseUrl":"http://localhost:7001","tenantId":"ci"'
          headers=$(curl -fsSI http://localhost:8080/ui/ci/workflows)
          echo "$headers"
          echo "$headers" | grep -i '^content-security-policy:.*connect-src .self. http://localhost:7001'
          curl -fsS http://localhost:8080/ui/ci/workflows | grep -F '<script src="./config.js"></script>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/missing.js)" = 404

      - name: Container log
        if: always()
        run: docker logs console || true

  # The smoke specs against a real server: runtara's evaluation stack, at the
  # release this repository builds against, with this commit's console
  # pointed at its API. Local auth, one tenant, no identity provider.
  e2e-smoke:
    name: E2E (real backend)
    # As the mocked job: Playwright 1.59.1 supports Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      RUNTARA_PORT: '7101'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # The release the validation WASM and the generated client come from.
      - name: Find the runtara release
        id: runtara
        run: |
          version="$(node -p "require('./package.json').dependencies['runtara-validation-wasm'].match(/download\/v([^/]+)\//)[1]")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the runtara evaluation stack
        env:
          RUNTARA_IMAGE_TAG: ${{ steps.runtara.outputs.version }}
        run: |
          mkdir stack
          curl -fsSL "https://raw.githubusercontent.com/runtarahq/runtara/v${RUNTARA_IMAGE_TAG}/docker-compose.yml" -o stack/docker-compose.yml
          docker compose -f stack/docker-compose.yml -p runtara-smoke up -d
          npx wait-on "http://localhost:${RUNTARA_PORT}/api/runtime/workflows" --timeout 180000

      - name: Build the console for that server
        env:
          VITE_RUNTARA_AUTH_MODE: local
          VITE_RUNTARA_TENANT_ID: evaluation
          VITE_STRIP_ORG_ID: 'true'
          VITE_RUNTARA_API_BASE_URL: http://localhost:7101
        run: npm run build

      - name: Serve preview build
        run: |
          npm run preview -- --host 127.0.0.1 --port 8081 &
          npx wait-on http://127.0.0.1:8081 --timeout 60000

      - name: Run smoke Playwright project
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8081
          E2E_SMOKE_AUTH_MODE: local
          CI: 'true'
        run: npx playwright test --project=smoke

      # The local-auth project: connections created, edited and deleted, and
      # workflows built on the canvas, through the console alone. Two of the
      # connection tests still expect how the sign-in popup behaved before
      # the console waited for it, and are left out (docs/refactoring.md,
      # M14).
      - name: Run local-ui Playwright project
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8081
          E2E_RUNTIME_URL: http://127.0.0.1:7101
          CI: 'true'
          STALE_TESTS: >-
            prompts a reconnect after a save that resets authorization|creates
            an OAuth connection without supplying the managed realm_id field
        run: >-
          npx playwright test --project=local-ui --workers=2
          e2e/tests/e2e/connections.local.e2e.spec.ts
          e2e/tests/e2e/connection-crud.local.e2e.spec.ts
          e2e/tests/e2e/connection-editor.local.e2e.spec.ts
          e2e/tests/e2e/workflow-builder.local.e2e.spec.ts
          --grep-invert "$STALE_TESTS"

      # The flows that go through the console and the server's API together:
      # building, validating, running and inspecting workflows.
      - name: Run e2e Playwright project
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8081
          GATEWAY_URL: http://127.0.0.1:7101
          RUNTIME_URL: http://127.0.0.1:7101
          E2E_SMOKE_AUTH_MODE: local
          CI: 'true'
        run: npx playwright test --project=e2e --workers=2

      - name: Server logs
        if: failure()
        env:
          RUNTARA_IMAGE_TAG: ${{ steps.runtara.outputs.version }}
        run: docker compose -f stack/docker-compose.yml -p runtara-smoke logs --tail 200 runtara

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-smoke-report
          path: |
            e2e-report/
            e2e-results/
          retention-days: 7
