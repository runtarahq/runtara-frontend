name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          # `lint` gates on ESLint errors only: most of today's warnings are
          # react-refresh/only-export-components, an HMR-ergonomics rule.
          - { name: lint, cmd: 'npm run lint' }
          - { name: format, cmd: 'npm run format:check' }
          - { name: typecheck, cmd: 'npx tsc -b --pretty' }
          - { name: unit, cmd: 'npm test' }
          - { name: knip, cmd: 'npm run knip' }
          - { name: build, cmd: 'npm run build' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.cmd }}

  e2e-mocked:
    name: E2E (mocked)
    # Playwright 1.59.1 supports Ubuntu 24.04; ubuntu-latest has moved to
    # 26.04, where its browser dependency installer fails before tests run.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build app
        run: npm run build

      - name: Serve preview build
        run: |
          npm run preview -- --port 8081 &
          npx wait-on http://localhost:8081 --timeout 60000

      - name: Run mocked Playwright project
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8081
          CI: 'true'
        run: npx playwright test --project=mocked

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mocked-report
          path: |
            e2e-report/
            e2e-results/
          retention-days: 14

  # The console image (Dockerfile): builds, renders config.js from env at
  # start, refuses a config it cannot serve, and serves the console's pages.
  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t runtara-frontend:ci --build-arg VERSION=0.0.0-ci .

      - name: Refuses oidc without an authority
        run: |
          if docker run --rm runtara-frontend:ci; then
              echo "::error::started with RUNTARA_UI_AUTH_MODE=oidc and no RUNTARA_UI_OIDC_AUTHORITY"
              exit 1
          fi

      - name: Serves the console with its rendered config
        run: |
          docker run -d --name console -p 8080:8080 \
            -e RUNTARA_UI_AUTH_MODE=local \
            -e RUNTARA_UI_API_BASE_URL=http://localhost:7001 \
            -e RUNTARA_UI_TENANT_ID=ci \
            runtara-frontend:ci
          for _ in $(seq 1 30); do
              curl -fsS http://localhost:8080/healthz >/dev/null && break
              sleep 1
          done
          curl -fsS http://localhost:8080/config.js | tee /dev/stderr \
            | grep -F '"hosting":"static","authMode":"local","apiBaseUrl":"http://localhost:7001","tenantId":"ci"'
          headers=$(curl -fsSI http://localhost:8080/ui/ci/workflows)
          echo "$headers"
          echo "$headers" | grep -i '^content-security-policy:.*connect-src .self. http://localhost:7001'
          curl -fsS http://localhost:8080/ui/ci/workflows | grep -F '<script src="./config.js"></script>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/missing.js)" = 404

      - name: Container log
        if: always()
        run: docker logs console || true
