name: Release

# A tag vX.Y.Z publishes runtara-frontend-X.Y.Z.tar.gz (the contents of dist/)
# and its .sha256 as a GitHub release, and the console image (Dockerfile) as
# ghcr.io/runtarahq/runtara-frontend:X.Y.Z, and :latest unless the tag is a
# prerelease. Runtara Cloud builds the same tag with its edition. The tag must
# match package.json's version.
#
# One build is published as both: `build` checks and bundles the console
# once, `image` wraps that bundle (the Dockerfile's BUNDLE=prebuilt), and
# `publish` creates the release only once the image is pushed, so a failure
# leaves no half-published release. The tarball and the image each carry a
# signed provenance attestation.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

# Each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check the tag against package.json
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$version" != "$declared" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${declared}"
              exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - run: npm ci --no-audit --no-fund

      # What a pull request is held to (ci.yml), on the commit being released.
      - name: Check
        run: |
          npm run lint -- --max-warnings 21
          npm run format:check
          npm run knip
          npm run test:coverage
          npm run check-api-runtime-release

      - name: Build
        env:
          VITE_RUNTARA_VERSION: ${{ steps.version.outputs.version }}
          VITE_RUNTARA_COMMIT: ${{ github.sha }}
          VITE_RUNTARA_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run build && npm run check-bundle-size

      - name: Package dist/
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          tarball="release/runtara-frontend-${VERSION}.tar.gz"
          tar -czf "$tarball" -C dist .
          (cd release && sha256sum "runtara-frontend-${VERSION}.tar.gz" > "runtara-frontend-${VERSION}.tar.gz.sha256")
          cat release/*.sha256

      # The same dist/, as the image takes it: without the placeholder
      # config.js (the image renders its own), beside the hash of the inline
      # script its CSP allows.
      - name: Prepare the bundle for the image
        run: |
          mkdir -p bundle/src
          cp -R dist bundle/src/dist
          node docker/inline-script-hashes.mjs dist/index.html > bundle/src/inline-script-hashes
          rm bundle/src/dist/config.js

      - name: Attest the tarball
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/runtara-frontend-${{ steps.version.outputs.version }}.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle
          path: bundle/
          if-no-files-found: error
          retention-days: 7

  image:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundle
          path: bundle

      - name: Tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          tags="${IMAGE}:${TAG#v}"
          if [[ "$TAG" != *-* ]]; then tags="${tags},${IMAGE}:latest"; fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The bundle `build` made, not one built again here: only the nginx
      # stage runs, once per platform.
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-contexts: |
            prebuilt=./bundle
          build-args: |
            BUNDLE=prebuilt
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Attest the image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    name: Create the GitHub Release
    runs-on: ubuntu-latest
    needs: [build, image]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags=(--prerelease); fi
          gh release create "$TAG" --title "Release ${TAG#v}" --generate-notes "${flags[@]}" release/*
