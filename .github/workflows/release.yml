name: Release

# A tag vX.Y.Z publishes runtara-frontend-X.Y.Z.tar.gz (the contents of dist/)
# and its .sha256 as a GitHub release, and the console image (Dockerfile) as
# ghcr.io/runtarahq/runtara-frontend:X.Y.Z, and :latest unless the tag is a
# prerelease. Runtara Cloud builds the same tag with its edition. The tag must
# match package.json's version.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check the tag against package.json
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$version" != "$declared" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${declared}"
              exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_RUNTARA_VERSION: ${{ steps.version.outputs.version }}
          VITE_RUNTARA_COMMIT: ${{ github.sha }}
          VITE_RUNTARA_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run build

      - name: Package dist/
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          tarball="release/runtara-frontend-${VERSION}.tar.gz"
          tar -czf "$tarball" -C dist .
          (cd release && sha256sum "runtara-frontend-${VERSION}.tar.gz" > "runtara-frontend-${VERSION}.tar.gz.sha256")
          cat release/*.sha256

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags=(--prerelease); fi
          gh release create "$TAG" --title "Release ${TAG#v}" --generate-notes "${flags[@]}" release/*

  image:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          tags="${IMAGE}:${TAG#v}"
          if [[ "$TAG" != *-* ]]; then tags="${tags},${IMAGE}:latest"; fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The bundle is built once on the runner's platform (the Dockerfile's
      # build stage is $BUILDPLATFORM); only the nginx stage is per platform.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
          labels: |
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
