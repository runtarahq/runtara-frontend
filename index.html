<!doctype html>
<html lang="en">
  <head>
    <base href="/" />
    <!-- The deployment's settings: the console image renders this file at
         startup from RUNTARA_UI_* env vars (docker/render-config.sh). -->
    <script src="./config.js"></script>
    <script>
      // Apply the persisted theme before first paint to avoid a light flash.
      // Mirrors themeStore's zustand-persist state ('theme-storage').
      (function () {
        try {
          var stored = localStorage.getItem('theme-storage');
          var theme = stored ? JSON.parse(stored).state.theme : 'system';
          if (
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* fall through to light */
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Runtara</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
